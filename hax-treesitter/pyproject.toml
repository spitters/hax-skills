[project]
name = "hax-treesitter"
version = "0.1.0"
description = "Tree-sitter based pre-check for hax-compatible Rust code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "hax-skills contributors"}
]
keywords = ["hax", "rust", "formal-verification", "tree-sitter", "linting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-rust>=0.23",
]

[project.optional-dependencies]
mcp = [
    "mcp>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
hax-lint = "hax_treesitter.lint:main"
hax-mcp-server = "hax_treesitter.mcp_server:main"

[project.urls]
Homepage = "https://github.com/spitters/hax-skills"
Repository = "https://github.com/spitters/hax-skills"
Documentation = "https://hax.rs"
Hax = "https://github.com/cryspen/hax"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hax_treesitter"]
